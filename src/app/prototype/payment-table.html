<kirby-data-grid-composable
  #grid="kirbyDataGridComposable"
  class="table-scroll"
  [data]="payments()"
  [columns]="columns"
  [tableOptions]="tableOptions"
>
  <table kirbyDataGridTable tabindex="0">
    <caption class="visually-hidden">
      Syntetiske betalinger
    </caption>
    <thead>
      @for (group of grid.table.getHeaderGroups(); track group.id) {
        <tr>
          @for (header of group.headers; track header.id) {
            <th kirby-data-grid-header-cell scope="col" [headerContext]="header.getContext()"></th>
          }
        </tr>
      }
    </thead>
    <tbody>
      @for (row of grid.table.getRowModel().rows; track row.id) {
        <tr>
          @for (cell of row.getVisibleCells(); track cell.id) {
            <td kirby-data-grid-cell [cellContext]="cell.getContext()"></td>
          }
        </tr>
      }
    </tbody>
  </table>
</kirby-data-grid-composable>
