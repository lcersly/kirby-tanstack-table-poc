name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CI: true
      npm_config_registry: https://registry.npmjs.org
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload checked production browser
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-demo
          path: dist/kirby-payment-overview-prototype/browser/
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: firebase-demo
      url: https://kirby-tanstack-table-poc.web.app
    permissions:
      actions: read
      contents: read
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: false
    steps:
      - name: Check out verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download checked production browser
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payment-demo
          path: dist/kirby-payment-overview-prototype/browser

      - name: Check that this revision is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-current-main.mjs

      - name: Deploy to Firebase Hosting
        id: deploy
        if: steps.current.outputs.is_current == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          credential_path="$RUNNER_TEMP/firebase-service-account.json"
          cleanup() {
            rm -f -- "$credential_path"
          }
          trap cleanup EXIT

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured in the firebase-demo environment." >&2
            exit 1
          fi

          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_path"
          FIREBASE_SERVICE_ACCOUNT_FILE="$credential_path" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            let credential;
            try {
              credential = JSON.parse(readFileSync(process.env.FIREBASE_SERVICE_ACCOUNT_FILE, "utf8"));
            } catch {
              throw new Error("FIREBASE_SERVICE_ACCOUNT is not valid JSON.");
            }
            if (
              credential.type !== "service_account" ||
              !/^github-hosting-deployer@[^@\s]+\.iam\.gserviceaccount\.com$/.test(credential.client_email ?? "") ||
              typeof credential.private_key !== "string"
            ) {
              throw new Error("FIREBASE_SERVICE_ACCOUNT is not the intended github-hosting-deployer service account.");
            }
            console.info("Verified Firebase service-account identity: github-hosting-deployer.");
          '

          GOOGLE_APPLICATION_CREDENTIALS="$credential_path" \
            npx --yes firebase-tools@15.34.1 deploy \
              --only hosting \
              --project kirby-tanstack-table-poc \
              --non-interactive

      - name: Verify the public release
        id: public_check
        if: steps.deploy.outcome == 'success'
        run: node scripts/verify-public-deployment.mjs verify

      - name: Inspect the live release after a deployment or verification error
        if: >-
          always() &&
          (steps.deploy.outcome == 'failure' ||
           steps.deploy.outcome == 'cancelled' ||
           steps.public_check.outcome == 'failure' ||
           steps.public_check.outcome == 'cancelled')
        run: node scripts/verify-public-deployment.mjs inspect
