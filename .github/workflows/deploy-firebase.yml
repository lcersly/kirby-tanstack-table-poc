name: Deploy checked Firebase artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA of the successful main CI artifact to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'lcersly/kirby-tanstack-table-poc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: firebase-demo
      url: https://kirby-tanstack-table-poc.web.app
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out trusted main workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Resolve successful CI artifact
        id: artifact
        run: node scripts/deploy-artifact.mjs resolve

      - name: Download selected CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          path: dist/kirby-payment-overview-prototype
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact.outputs.run_id }}

      - name: Validate artifact provenance
        id: provenance
        env:
          CI_RUN_ID: ${{ steps.artifact.outputs.run_id }}
          CI_RUN_ATTEMPT: ${{ steps.artifact.outputs.run_attempt }}
        run: node scripts/deploy-artifact.mjs validate

      - name: Reject a superseded source revision
        run: node scripts/deploy-artifact.mjs check-current

      - name: Deploy checked artifact to Firebase Hosting
        id: deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: kirby-tanstack-table-poc
          FIREBASE_SITE_ID: kirby-tanstack-table-poc
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          credential_path="$RUNNER_TEMP/firebase-service-account.json"
          sites_output="$RUNNER_TEMP/firebase-hosting-sites.json"
          cleanup() {
            rm -f -- "$credential_path" "$sites_output"
          }
          trap cleanup EXIT

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured in the firebase-demo environment." >&2
            exit 1
          fi

          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_path"
          FIREBASE_SERVICE_ACCOUNT_FILE="$credential_path" node scripts/verify-firebase-service-account.mjs

          GOOGLE_APPLICATION_CREDENTIALS="$credential_path" npx --yes firebase-tools@15.34.1 \
            hosting:sites:list --project "$FIREBASE_PROJECT_ID" --non-interactive --json > "$sites_output"

          if ! grep -Fq "\"$FIREBASE_SITE_ID\"" "$sites_output"; then
            echo "The authenticated account cannot find the expected Firebase Hosting site." >&2
            exit 1
          fi

          node scripts/deploy-artifact.mjs check-current

          GOOGLE_APPLICATION_CREDENTIALS="$credential_path" npx --yes firebase-tools@15.34.1 \
            deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Verify public release and visible build identity
        id: public_check
        if: steps.deploy.outcome == 'success'
        env:
          EXPECTED_COMMIT: ${{ steps.provenance.outputs.short_commit }}
          EXPECTED_KIRBY_VERSION: ${{ steps.provenance.outputs.kirby_version }}
          EXPECTED_SOURCE_SHA: ${{ steps.provenance.outputs.source_commit }}
        run: node scripts/verify-public-deployment.mjs

      - name: Inspect live release after a deployment or verification error
        if: >-
          always() &&
          (steps.deploy.outcome == 'failure' ||
           steps.deploy.outcome == 'cancelled' ||
           steps.public_check.outcome == 'failure' ||
           steps.public_check.outcome == 'cancelled')
        run: node scripts/inspect-public-release.mjs
